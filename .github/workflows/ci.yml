name: ci

# The voice layer claims to run on macOS, Linux and Windows. Two of those three cannot
# be checked on the machine it was written on, so they are checked here instead — the
# Linux job installs a real speech engine and a real audio backend and runs the same
# suites, rather than trusting that the dispatch code was right.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung step should fail in minutes, not burn the default six hours. The apt step
    # below hung for over twenty minutes once with nothing to show for it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # espeak-ng gives the Linux job a genuine speech backend to detect and measure;
      # alsa-utils gives it a genuine audio backend. There is no sound card on a runner,
      # so playback fails — which is itself worth exercising, because a missing device
      # must degrade to silence and never to a non-zero hook.
      #
      # Only on the job that actually runs the shell suites. It was running on all three
      # Linux jobs, so two of them spent minutes installing packages they never touched —
      # and it was one of those two that hung for twenty minutes on apt.
      # espeak-ng gives the Linux job a genuine speech backend to detect and to measure
      # phrase lengths against. It is BEST EFFORT: `apt-get update` hung for six minutes
      # producing no output at all on two consecutive runs, and an apt outage on a runner
      # is not a reason to fail a build. The suite skips what it cannot exercise, and
      # still fails if a tool is present but the platform layer does not detect it.
      - name: Linux audio and speech backends (best effort)
        if: runner.os == 'Linux' && matrix.node == '20'
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=2 || echo "apt-get update did not finish; continuing"
          timeout 120 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "espeak-ng not installed; speech checks will skip"
          # ffmpeg ships on the runner image and ffplay is one of the audio backends the
          # platform layer accepts, so alsa-utils is only a fallback — it was what hung
          # the very first version of this step.
          command -v ffplay >/dev/null 2>&1 || timeout 120 sudo apt-get install -y -qq --no-install-recommends alsa-utils || true
          echo "speech backend: $(command -v espeak-ng || echo NONE)"
          echo "audio backend:  $(command -v ffplay || command -v aplay || command -v paplay || echo NONE)"

      - run: node --version && bash --version | head -1

      - name: Unit tests
        run: npm test

      - name: Registry and swarm health
        run: |
          node scripts/jarvis.mjs health
          node scripts/jarvis.mjs doctor

      # Only on one node version per OS: these are wall-clock heavy (real sleeps, real
      # daemon lifecycles) and they exercise shell behaviour, not the Node version.
      - name: Platform and speech assertions
        if: matrix.node == '20'
        run: tests/voice-audio.sh

      - name: Concurrency harness
        if: matrix.node == '20'
        run: tests/voice-concurrency.sh

      - name: Install end to end, then verify with doctor
        if: matrix.node == '20'
        run: |
          export CLAUDE_JARVIS_DIR="$HOME/.claude/jarvis"
          export CLAUDE_SETTINGS_FILE="$HOME/.claude/settings.json"
          mkdir -p "$HOME/.claude" && echo '{}' > "$CLAUDE_SETTINGS_FILE"
          node scripts/jarvis.mjs voice --apply
          "$HOME/.claude/jarvis/jarvisctl" doctor
          "$HOME/.claude/jarvis/jarvisctl" report --text

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      # The shell here has to run on bash 3.2 (macOS), bash 5 (Linux) and Git Bash, so
      # portability warnings are the ones that matter most.
      - run: shellcheck --shell=bash --severity=warning voice/*.sh voice/jarvisctl tests/*.sh

  windows:
    name: windows · path handling
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The Windows job deliberately does NOT try to play audio: a runner has no device
      # and no voice. What it proves is that the installer produces a hook command
      # Windows can actually execute, and that the shell scripts parse under Git Bash.
      - name: Unit tests
        run: npm test
      - name: Install, and check the hook command is executable here
        shell: bash
        run: |
          export CLAUDE_JARVIS_DIR="$HOME/.claude/jarvis"
          export CLAUDE_SETTINGS_FILE="$HOME/.claude/settings.json"
          mkdir -p "$HOME/.claude" && echo '{}' > "$CLAUDE_SETTINGS_FILE"
          node scripts/jarvis.mjs voice --apply
          node -e "
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync(process.env.CLAUDE_SETTINGS_FILE,'utf8'));
            const cmds=Object.values(s.hooks).flatMap(g=>g.flatMap(x=>x.hooks.map(h=>h.command)));
            const jarvis=cmds.filter(c=>c.includes('jarvis'));
            if(jarvis.length!==8) throw new Error('expected 8 hooks, got '+jarvis.length);
            for(const c of jarvis){
              if(c.includes('\\\\')) throw new Error('backslash in hook command: '+c);
              if(!c.startsWith('bash ')) throw new Error('hook does not invoke bash: '+c);
            }
            console.log('hook commands are Windows-executable:'); jarvis.forEach(c=>console.log('  '+c));
          "
      - name: The shell scripts parse under Git Bash
        shell: bash
        run: |
          for f in voice/*.sh voice/jarvisctl tests/*.sh; do bash -n "$f" && echo "ok  $f"; done
      - name: jarvisctl runs
        shell: bash
        run: |
          "$HOME/.claude/jarvis/jarvisctl" report --text
          "$HOME/.claude/jarvis/jarvisctl" doctor || true
